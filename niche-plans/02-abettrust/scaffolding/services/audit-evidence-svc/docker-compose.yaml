# Self-contained stack: Postgres + audit-evidence-svc. Run from the REPO ROOT:
#   docker compose -f niche-plans/02-abettrust/scaffolding/services/audit-evidence-svc/docker-compose.yaml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: abettrust
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  audit-evidence-svc:
    build:
      context: ../../../../..
      dockerfile: niche-plans/02-abettrust/scaffolding/services/audit-evidence-svc/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/abettrust
      JWT_SECRET: dev-secret-change-me
      PORT: "3002"
    ports: ["3002:3002"]
    depends_on:
      postgres:
        condition: service_healthy
