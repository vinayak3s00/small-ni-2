[project]
name = "abet-voice-orchestrator"
version = "1.0.0"
description = "AbetVoice orchestrator: STT->intent->TTS turn loop with barge-in handling."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
