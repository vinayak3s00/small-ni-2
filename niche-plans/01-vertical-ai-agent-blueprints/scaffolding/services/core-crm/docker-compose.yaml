# Self-contained stack for core-crm: Postgres + the service.
#   docker compose up --build
# Then: POST http://localhost:3001/v1/records with a Bearer JWT.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: abetverticals
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  core-crm:
    # Build context is the repo root so the shared @abetworks/core lib is
    # available to COPY. Run this compose file from the repo root:
    #   docker compose -f niche-plans/01-vertical-ai-agent-blueprints/scaffolding/services/core-crm/docker-compose.yaml up --build
    build:
      context: ../../../../..
      dockerfile: niche-plans/01-vertical-ai-agent-blueprints/scaffolding/services/core-crm/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/abetverticals
      JWT_SECRET: dev-secret-change-me
      PORT: "3001"
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
