# Self-contained stack: Postgres + attribution-svc. Run from the REPO ROOT:
#   docker compose -f niche-plans/01-vertical-ai-agent-blueprints/scaffolding/services/attribution-svc/docker-compose.yaml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: abetverticals
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  attribution-svc:
    build:
      context: ../../../../..
      dockerfile: niche-plans/01-vertical-ai-agent-blueprints/scaffolding/services/attribution-svc/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/abetverticals
      JWT_SECRET: dev-secret-change-me
      PORT: "3011"
    ports: ["3011:3011"]
    depends_on:
      postgres:
        condition: service_healthy
