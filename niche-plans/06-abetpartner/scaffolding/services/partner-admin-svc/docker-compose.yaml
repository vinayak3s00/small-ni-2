# Self-contained stack: Postgres + partner-admin-svc. Run from the REPO ROOT:
#   docker compose -f niche-plans/06-abetpartner/scaffolding/services/partner-admin-svc/docker-compose.yaml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: abetpartner
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  partner-admin-svc:
    build:
      context: ../../../../..
      dockerfile: niche-plans/06-abetpartner/scaffolding/services/partner-admin-svc/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/abetpartner
      JWT_SECRET: dev-secret-change-me
      PORT: "3006"
    ports: ["3006:3006"]
    depends_on:
      postgres:
        condition: service_healthy
