# Self-contained stack: Postgres + sync-gateway. Run from the REPO ROOT:
#   docker compose -f niche-plans/08-abetfield/scaffolding/services/sync-gateway/docker-compose.yaml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: abetfield
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  sync-gateway:
    build:
      context: ../../../../..
      dockerfile: niche-plans/08-abetfield/scaffolding/services/sync-gateway/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/abetfield
      JWT_SECRET: dev-secret-change-me
      PORT: "3008"
    ports: ["3008:3008"]
    depends_on:
      postgres:
        condition: service_healthy
