apiVersion: v1
kind: Service
metadata:
  name: {{ include "abet.name" . }}
  labels:
    {{- include "abet.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "abet.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
