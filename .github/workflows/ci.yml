name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  license-headers:
    name: Proprietary header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify proprietary headers
        run: bash scripts/check_license_headers.sh

  tests:
    name: Service test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Run all service test suites
        run: bash scripts/run_all_tests.sh

  core-crm-integration:
    name: core-crm Postgres integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: abetverticals
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build shared core lib
        run: cd niche-plans/00-platform-baseline/packages/core && npm install && npm run build
      - name: Run core-crm tests (incl. Postgres integration)
        working-directory: niche-plans/01-vertical-ai-agent-blueprints/scaffolding/services/core-crm
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/abetverticals
        run: npm install && npm run build && npm test
