name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  license-headers:
    name: Proprietary header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify proprietary headers
        run: bash scripts/check_license_headers.sh

  tests:
    name: Service test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Run all service test suites
        run: bash scripts/run_all_tests.sh
